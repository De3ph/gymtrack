name: Frontend typecheck

# Type gate for frontend/. `next build` also type-checks (next.config.ts no
# longer sets typescript.ignoreBuildErrors), but running it standalone keeps the
# signal fast and independent of the memory-hungry prerender phase. See
# frontend/next.config.ts for the build memory flags.

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-typecheck.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-typecheck.yml'

jobs:
  typecheck:
    name: Typecheck (tsc --noEmit)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck