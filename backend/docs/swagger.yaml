info:
  contact: {}
  description: GymTrack backend API
  title: GymTrack API
  version: "1.0"
paths:
  /admin/comments:
    get:
      consumes:
      - application/json
      description: List all comments with pagination and target type filter.
      parameters:
      - description: Page size (default 25)
        in: query
        name: limit
        type: integer
      - description: Page offset
        in: query
        name: offset
        type: integer
      - description: Filter by target type (workout, meal)
        in: query
        name: targetType
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: List of comments
          schema:
            $ref: '#/definitions/handlers.AdminCommentListResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List all comments (Admin only)
      tags:
      - Admin
  /admin/comments/{id}:
    delete:
      consumes:
      - application/json
      description: Force-delete any comment without ownership check.
      parameters:
      - description: Comment ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Comment deleted successfully
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid comment id
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Comment not found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Delete comment (Admin only)
      tags:
      - Admin
  /admin/exercises/{id}:
    delete:
      consumes:
      - application/json
      description: Force-delete an exercise.
      parameters:
      - description: Exercise ID
        in: path
