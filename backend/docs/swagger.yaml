components:
  schemas:
    handlers.AcceptInvitationRequest:
      properties:
        code:
          type: string
      required:
      - code
      type: object
    handlers.AdminCommentListItem:
      properties:
        authorId:
          type: integer
        authorRole:
          type: string
        commentId:
          type: integer
        content:
          type: string
        createdAt:
          type: string
        editedAt:
          type: string
        parentCommentId:
          type: integer
        targetId:
          type: integer
        targetType:
          type: string
      type: object
    handlers.AdminCommentListResponse:
      properties:
        comments:
          items:
            $ref: '#/components/schemas/handlers.AdminCommentListItem'
          type: array
          uniqueItems: false
        limit:
          type: integer
        offset:
          type: integer
        total:
          type: integer
      type: object
    handlers.AdminUserListItem:
      properties:
        createdAt:
          type: string
        email:
          type: string
        profile:
          $ref: '#/components/schemas/models.UserProfile'
        role:
          $ref: '#/components/schemas/models.UserRole'
        updatedAt:
          type: string
        userId:
          type: integer
        username:
          type: string
      type: object
    handlers.AdminUserListResponse:
      properties:
        limit:
          type: integer
        offset:
          type: integer
        total:
          type: integer
        users:
          items:
            $ref: '#/components/schemas/handlers.AdminUserListItem'
          type: array
          uniqueItems: false
      type: object
    handlers.BodyMeasurementPartDTO:
      properties:
        value:
          minimum: 0
          type: number
      type: object
    handlers.ChangePasswordRequest:
      properties:
        newPassword:
          minLength: 8
          type: string
        oldPassword:
          type: string
      required:
      - newPassword
      - oldPassword
      type: object
    handlers.ClientStats:
      properties:
        mealsThisWeek:
          type: integer
        workoutsThisWeek:
          type: integer
      type: object
    handlers.CreateBodyMeasurementRequest:
      properties:
        bodyFatPct:
          maximum: 100
          minimum: 0
          type: number
        date:
          type: string
        notes:
          maxLength: 500
          type: string
        parts:
          additionalProperties:
            $ref: '#/components/schemas/handlers.BodyMeasurementPartDTO'
          type: object
        weight:
          type: number
        weightUnit:
          $ref: '#/components/schemas/models.WeightUnit'
      required:
      - date
      - weight
      - weightUnit
      type: object
    handlers.CreateCoachingRequestRequest:
      properties:
        message:
          type: string
        trainerId:
          type: integer
      required:
      - trainerId
      type: object
    handlers.CreateCommentRequest:
      description: Request body for creating a new comment on a workout or meal.
      properties:
        content:
          maxLength: 2000
          minLength: 1
          type: string
        parentCommentId:
          type: string
        targetId:
          type: string
        targetType:
          $ref: '#/components/schemas/models.TargetType'
      required:
      - content
      - targetId
      - targetType
      type: object
    handlers.CreateExerciseRequest:
      properties:
        category:
          type: string
        equipmentId:
          type: integer
        muscleGroupId:
          type: integer
        name:
          type: string
      required:
      - category
      - equipmentId
      - muscleGroupId
      - name
      type: object
    handlers.CreateMealRequest:
      description: Request body for creating a new meal entry
      properties:
        date:
          type: string
        items:
          items:
            $ref: '#/components/schemas/models.FoodItem'
          minItems: 1
          type: array
          uniqueItems: false
        mealType:
