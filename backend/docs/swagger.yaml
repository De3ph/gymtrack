externalDocs:
  description: ""
  url: ""
info:
  description: GymTrack backend API
  title: GymTrack API
  version: "1.0"
openapi: 3.1.0
paths:
  /admin/comments:
    get:
      description: List all comments with pagination and target type filter.
      parameters:
      - description: Page size (default 25)
        in: query
        name: limit
        schema:
          type: integer
      - description: Page offset
        in: query
        name: offset
        schema:
          type: integer
      - description: Filter by target type (workout, meal)
        in: query
        name: targetType
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.AdminCommentListResponse'
          description: List of comments
        "401":
          content:
            application/json:
              schema:
                additionalProperties: {}
                type: object
          description: Unauthorized
        "500":
          content:
            application/json:
              schema:
                additionalProperties: {}
                type: object
          description: Internal server error
      security:
      - BearerAuth: []
      summary: List all comments (Admin only)
      tags:
      - Admin
  /admin/comments/{id}:
    delete:
      description: Force-delete any comment without ownership check.
      parameters:
      - description: Comment ID
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Comment deleted successfully
        "400":
          content:
            application/json:
              schema:
                additionalProperties: {}
                type: object
          description: Invalid comment id
        "401":
          content:
            application/json:
              schema:
                additionalProperties: {}
                type: object
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                additionalProperties: {}
                type: object
          description: Comment not found
        "500":
          content:
            application/json:
              schema:
                additionalProperties: {}
                type: object
          description: Internal server error
      security:
      - BearerAuth: []
      summary: Delete comment (Admin only)
      tags:
      - Admin
  /admin/exercises/{id}:
    delete:
      description: Force-delete an exercise.
      parameters:
      - description: Exercise ID
