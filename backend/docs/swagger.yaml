      required:
      - date
      - items
      - mealType
      type: object
    handlers.CreateReviewRequest:
      description: Request body for creating a review for a trainer.
      properties:
        comment:
          type: string
        rating:
          maximum: 5
          minimum: 1
          type: integer
      required:
      - rating
      type: object
    handlers.CreateWorkoutRequest:
      description: Request to create a new workout
      properties:
        date:
          type: string
        exercises:
          items:
            $ref: '#/components/schemas/models.WorkoutExercise'
