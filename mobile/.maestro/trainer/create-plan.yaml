# Trainer — Create Workout Plan
# Login → navigate to plans → open create sheet → pick exercise → submit → verify list

name: Create Workout Plan
appId: com.gymtrack.app
---
# Login
- launchApp
- assertVisible:
    text: "Login to Your Account"
    timeout: 10000
- tapOn: "Email or Username"
- inputText: "${TRAINER_EMAIL}"
- tapOn: "Password"
- inputText: "${TRAINER_PASSWORD}"
- tapOn: "Login"
- assertVisible:
    text: "Home"
    timeout: 15000

# Navigate to trainer plans via deep link (route is not in bottom tabs)
- openLink:
    url: "exp://localhost:8081/--/trainer/plans"

# Open the create sheet from the FAB (accessibility label)
- tapOn: "Create Plan"

# Plan identity
- tapOn: "Plan Name"
- inputText: "Maestro Push Plan"
- tapOn: "Brief description of the plan"
- inputText: "Chest and triceps day"

# Pick an exercise from the catalog
- tapOn: "Pick Exercise"
- assertVisible:
    text: "Exercise Catalog"
    timeout: 10000
- tapOn: "Search exercises..."
- inputText: "Bench"
- tapOn: "Bench Press"

# Submit the sheet
- tapOn: "Create Plan"

# The sheet closes and the new plan appears in the list
- assertVisible:
    text: "Maestro Push Plan"
    timeout: 15000
