# Athlete — View Assigned Workout Plans
# Login → navigate to workout plans → verify list or empty state

name: View Workout Plans
appId: com.gymtrack.app
---
# Login
- launchApp
- assertVisible:
    text: "Login to Your Account"
    timeout: 10000
- tapOn: "Email or Username"
- inputText: "${ATHLETE_EMAIL}"
- tapOn: "Password"
- inputText: "${ATHLETE_PASSWORD}"
- tapOn: "Login"
- assertVisible:
    text: "Home"
    timeout: 15000

# Navigate to workout plans via deep link
- openLink:
    url: "exp://localhost:8081/--/athlete/workout-plans"

# Verify workout plans screen loads (plans list or empty state)
- assertVisible:
    text: "No assigned plans"
    timeout: 15000