# Login — empty fields validation
appId: com.gymtrack.app
---
- launchApp

- extendedWaitUntil:
    visible:
      text: "Login to Your Account"
    timeout: 10000

# Submit with empty fields
- tapOn: "Login"

# Validation error for email
- extendedWaitUntil:
    visible:
      text: "required"
    timeout: 5000
