# Auth — Registration flows
# Combines: athlete register, trainer register, duplicate email error

name: Athlete Registration
appId: com.gymtrack.app
---
- launchApp

- extendedWaitUntil:
    visible:
      text: "Login to Your Account"
    timeout: 10000

- tapOn: "Sign up"

- extendedWaitUntil:
    visible:
      text: "Create Your Account"
    timeout: 5000

# Athlete role selected by default — no tap needed

- tapOn: "Username"
- inputText: "testathlete"

- tapOn: "Email"
- inputText: "test-athlete-${uniqueId()}@example.com"

- tapOn: "Password"
- inputText: "TestPass123!"

- tapOn: "Confirm Password"
- inputText: "TestPass123!"

- tapOn: "Create Account"

- extendedWaitUntil:
    visible:
      text: "Home"
    timeout: 15000

---

name: Trainer Registration
appId: com.gymtrack.app
---
- launchApp

- extendedWaitUntil:
    visible:
      text: "Login to Your Account"
    timeout: 10000

- tapOn: "Sign up"

- extendedWaitUntil:
    visible:
      text: "Create Your Account"
    timeout: 5000

# Switch to trainer role
- tapOn: "Trainer"

- tapOn: "Username"
- inputText: "testtrainer"

- tapOn: "Email"
- inputText: "test-trainer-${uniqueId()}@example.com"

- tapOn: "Password"
- inputText: "TestPass123!"

- tapOn: "Confirm Password"
- inputText: "TestPass123!"

- tapOn: "Create Account"

- extendedWaitUntil:
    visible:
      text: "Home"
    timeout: 15000

---

name: Duplicate Email Error
appId: com.gymtrack.app
---
- launchApp

- extendedWaitUntil:
    visible:
      text: "Login to Your Account"
    timeout: 10000

- tapOn: "Sign up"

- extendedWaitUntil:
    visible:
      text: "Create Your Account"
    timeout: 5000

- tapOn: "Username"
- inputText: "dupuser"

- tapOn: "Email"
- inputText: "${ATHLETE_EMAIL}"

- tapOn: "Password"
- inputText: "TestPass123!"

- tapOn: "Confirm Password"
- inputText: "TestPass123!"

- tapOn: "Create Account"

- extendedWaitUntil:
    visible:
      text: "already"
    timeout: 10000