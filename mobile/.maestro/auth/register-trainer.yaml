# Register — trainer happy path
appId: com.gymtrack.app
---
- launchApp

- extendedWaitUntil:
    visible:
      text: "Login to Your Account"
    timeout: 10000

- tapOn: "Sign up"

- extendedWaitUntil:
    visible:
      text: "Create Your Account"
    timeout: 5000

# Switch to trainer role
- tapOn: "Trainer"

- tapOn:
    text: "Username"
- inputText: "testtrainer"

- tapOn:
    text: "Email"
- inputText: "test-trainer-${uniqueId()}@example.com"

- tapOn:
    text: "Password"
- inputText: "TestPass123"

- tapOn:
    text: "Confirm Password"
- inputText: "TestPass123"

- tapOn: "Create Account"

- extendedWaitUntil:
    visible:
      text: "Home"
    timeout: 15000
