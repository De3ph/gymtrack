---

name: Invalid Credentials
appId: com.gymtrack.app
---
- launchApp

- extendedWaitUntil:
    visible:
      text: "Login to Your Account"
    timeout: 10000

- tapOn: "Email or Username"
- inputText: "wrong@example.com"

- tapOn: "Password"
- inputText: "WrongPass123"

- tapOn: "Login"

- extendedWaitUntil:
    visible:
      text: "Invalid"
    timeout: 10000

---

name: Empty Fields Validation
appId: com.gymtrack.app
---
- launchApp

- extendedWaitUntil:
    visible:
      text: "Login to Your Account"
    timeout: 10000

- tapOn: "Login"

- extendedWaitUntil:
    visible:
      text: "required"
    timeout: 5000