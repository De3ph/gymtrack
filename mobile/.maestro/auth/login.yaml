# Auth — Login flows
# Combines: athlete login, trainer login, invalid credentials, empty fields validation

name: Athlete Login
appId: com.gymtrack.app
---
- launchApp

- extendedWaitUntil:
    visible:
      text: "Login to Your Account"
    timeout: 10000

- tapOn: "Email or Username"
- inputText: "${ATHLETE_EMAIL}"

- tapOn: "Password"
- inputText: "${ATHLETE_PASSWORD}"

- tapOn: "Login"

- extendedWaitUntil:
    visible:
      text: "Home"
    timeout: 15000

---

