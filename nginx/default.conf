upstream gymtrack_backend {
    server backend:8080;
    keepalive 32;
}

upstream gymtrack_frontend {
    server frontend:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    # Next.js route handler that must NOT be shadowed by the backend catch-all
    # below. The HttpOnly session cookie is set/read/cleared by the frontend
    # (frontend/src/app/api/auth/session/route.ts), which the browser calls
    # same-origin at /api/auth/session. The Go backend has no such route, so
    # proxying it to the API returns 404 and login never persists. Exact match
    # ("=") wins over the "/api/" prefix location regardless of order.
    location = /api/auth/session {
        proxy_pass http://gymtrack_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend API
    location /api/ {
        proxy_pass http://gymtrack_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Swagger UI
    location /swagger/ {
        proxy_pass http://gymtrack_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Prometheus metrics (restrict in production if desired)
    location = /metrics {
        proxy_pass http://gymtrack_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Readiness probe for external uptime monitors (DB ping; 503 when down).
    location = /healthz {
        proxy_pass http://gymtrack_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Frontend (Next.js)
    location / {
        proxy_pass http://gymtrack_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }
}