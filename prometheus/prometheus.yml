# Prometheus configuration for GymTrack backend metrics.
# Scrape target: the `backend` compose service on the shared `gymtrack` network
# (service DNS), so this works identically on Linux servers and Docker Desktop.
# When running Prometheus outside compose, override the target with
# `--set`/an additional scrape config instead of editing this file.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    job: gymtrack-backend

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: gymtrack-backend
    metrics_path: /metrics
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets:
          - backend:8080
        labels:
          job: gymtrack-backend
    metric_relabel_configs:
      # Drop promhttp internal handler metrics — noise from the /metrics endpoint itself.
      - action: drop
        source_labels: [__name__]
        regex: 'promhttp_metric_handler_.*'
