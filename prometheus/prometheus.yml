# Prometheus configuration for GymTrack backend metrics.
# Scrape target: backend running on the host (NOT containerized) at :8080.
# host.docker.internal resolves to the Docker host on Docker Desktop (Windows/macOS).
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    job: gymtrack-backend

scrape_configs:
  - job_name: gymtrack-backend
    metrics_path: /metrics
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets:
          - host.docker.internal:8080
        labels:
          job: gymtrack-backend
    metric_relabel_configs:
      # Drop promhttp internal handler metrics — noise from the /metrics endpoint itself.
      - action: drop
        source_labels: [__name__]
        regex: 'promhttp_metric_handler_.*'
