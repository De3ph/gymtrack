# Production-ready compose for GymTrack (excludes mobile app).
# Usage:
#   cp .env.example .env   # fill in secrets
#   docker compose up -d --build
#
# Services:
#   db            - custom PostgreSQL 16 image (pgaudit, pg_partman)
#   migrate       - one-shot DB migration runner
#   backend       - Go/Gin API (port 8080, internal)
#   frontend      - Next.js 16 standalone (port 3000, internal)
#   reverse-proxy - nginx (public 80/443)
#   prometheus/grafana - monitoring (default)
#   pgadmin       - DB admin UI (profile: tools)

services:
  db:
    build:
      context: ./postgres
      dockerfile: Dockerfile
    image: gymtrack-postgres:16-ext
    container_name: gymtrack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gymtrack}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init-extensions.sql:/docker-entrypoint-initdb.d/init-extensions.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-gymtrack}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements,pgaudit,pg_partman_bgw
      -c pg_stat_statements.max=10000
      -c pg_stat_statements.track=all
      -c pgaudit.log=write,ddl,role
      -c pgaudit.log_parameter=on
      -c pgaudit.log_relation=on
      -c pg_partman_bgw.interval=1h
      -c pg_partman_bgw.role=${POSTGRES_USER:-postgres}
      -c pg_partman_bgw.dbname=${POSTGRES_DB:-gymtrack}
    networks:
      - gymtrack
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: gymtrack-backend:latest
    container_name: gymtrack-migrate
    command: ["/app/migrate", "-dir", "up"]
    environment:
      POSTGRES_DSN: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-gymtrack}?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    networks:
      - gymtrack
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: gymtrack-backend:latest
    container_name: gymtrack-backend
    restart: unless-stopped
    environment:
      POSTGRES_DSN: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-gymtrack}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-0.1}
      PPROF_ENABLED: ${PPROF_ENABLED:-false}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/metrics"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - gymtrack
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
    image: gymtrack-frontend:latest
    container_name: gymtrack-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - gymtrack
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  reverse-proxy:
    image: nginx:1.27-alpine
    container_name: gymtrack-reverse-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - gymtrack
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: gymtrack-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
    networks:
      - gymtrack
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  grafana:
    image: grafana/grafana:11.5.0
    container_name: gymtrack-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - gymtrack
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  pgadmin:
    image: dpage/pgadmin4:8.14
    container_name: gymtrack-pgadmin
    restart: unless-stopped
    profiles: ["tools"]
    ports:
      - "127.0.0.1:5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy
    networks:
      - gymtrack
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

volumes:
  pgdata:
  prometheus_data:
  grafana_data:
  pgadmin_data:

networks:
  gymtrack:
    driver: bridge