# Production-ready compose for GymTrack (excludes mobile app).
# Usage:
#   cp .env.example .env   # fill in secrets
#   docker compose up -d --build
#
# All credentials are interpolated from the (git-ignored) .env file: nothing
# secret is hardcoded here, and the always-on secrets (DB roles, JWT/session,
# Grafana) use ${VAR:?} so compose refuses to start when they are missing. The
# optional pgadmin tools profile uses an empty default instead, because compose
# interpolates every service regardless of profile — a required variable there
# would block the default stack.
#
# `deploy.resources.limits` is honoured by Docker Compose v2 outside Swarm.
# Verify the resolved config (and the limits) with:  docker compose config
#
# Services:
#   db            - custom PostgreSQL 16 image (pgaudit)
#   migrate       - one-shot DB migration runner
#   backend       - Go/Gin API (port 8080, internal)
#   frontend      - Next.js 16 standalone (port 3000, internal)
#   reverse-proxy - nginx (public 80/443)
#   prometheus/grafana - monitoring (default)
#   pgadmin       - DB admin UI (profile: tools)

services:
  db:
    build:
      context: ./postgres
      dockerfile: Dockerfile
    image: gymtrack-postgres:16-ext
    container_name: gymtrack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gymtrack}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init-extensions.sql:/docker-entrypoint-initdb.d/init-extensions.sql:ro
    ports:
      # Host-side port only (debug access); every container reaches the DB as
      # db:5432 over the gymtrack network. Default 5433 keeps the stack clear of
      # a native PostgreSQL install already holding 5432 on the host.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-gymtrack}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements,pgaudit
      -c pg_stat_statements.max=10000
      -c pg_stat_statements.track=all
      -c pgaudit.log=write,ddl,role
      -c pgaudit.log_parameter=on
      -c pgaudit.log_relation=on
    networks:
      - gymtrack
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  # One-shot bootstrap: creates the least-privilege roles (DML-only app role and
  # schema-owner migration role) and transfers object ownership. Idempotent, so
  # it is safe to run on every deploy.
  db-roles:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: gymtrack-backend:latest
    container_name: gymtrack-db-roles
    command: ["/app/db-roles"]
    environment:
      POSTGRES_ADMIN_DSN: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-gymtrack}?sslmode=disable
      APP_DB_USER: ${APP_DB_USER:-gymtrack_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD is required}
      MIGRATE_DB_USER: ${MIGRATE_DB_USER:-gymtrack_migrate}
      MIGRATE_DB_PASSWORD: ${MIGRATE_DB_PASSWORD:?MIGRATE_DB_PASSWORD is required}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - gymtrack
    restart: "no"

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: gymtrack-backend:latest
    container_name: gymtrack-migrate
    command: ["/app/migrate", "-dir", "up"]
    environment:
      # DDL runs as the owner role, never as the superuser.
      POSTGRES_DSN: postgres://${MIGRATE_DB_USER:-gymtrack_migrate}:${MIGRATE_DB_PASSWORD}@db:5432/${POSTGRES_DB:-gymtrack}?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
      db-roles:
        condition: service_completed_successfully
    networks:
      - gymtrack
    restart: "no"

  create-admin:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: gymtrack-backend:latest
    container_name: gymtrack-create-admin
    command: ["/app/create-admin"]
    environment:
      # Runs as the schema owner (can insert/update users). Idempotent.
      POSTGRES_DSN: postgres://${MIGRATE_DB_USER:-gymtrack_migrate}:${MIGRATE_DB_PASSWORD}@db:5432/${POSTGRES_DB:-gymtrack}?sslmode=disable
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL is required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - gymtrack
    restart: "no"


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: gymtrack-backend:latest
    container_name: gymtrack-backend
    restart: unless-stopped
    environment:
      # Runtime connects as the DML-only role; DDL belongs to `migrate`.
      POSTGRES_DSN: postgres://${APP_DB_USER:-gymtrack_app}:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB:-gymtrack}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      APP_ENV: ${APP_ENV:-production}
      PORT: ${PORT:-8080}
      # Only the compose reverse proxy may set X-Forwarded-For; everything else
      # is ignored so ClientIP cannot be spoofed to bypass the rate limiter.
      # The default matches the pinned `gymtrack` network subnet below — do not
      # widen it to 172.16.0.0/12 or any host container could spoof client IPs.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.31.0.0/24}
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-0.1}
      PPROF_ENABLED: ${PPROF_ENABLED:-false}
      # Public URL advertised by the OpenAPI spec (empty = host-relative).
      SWAGGER_SERVER_URL: ${SWAGGER_SERVER_URL:-}
      # user_audit_logs retention window in days; 0 disables the pruning job.
      AUDIT_LOG_RETENTION_DAYS: ${AUDIT_LOG_RETENTION_DAYS:-365}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8080:8080"
    # Mirrors the image HEALTHCHECK: readiness probe (DB ping), not liveness.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - gymtrack
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Browser-facing API base; "/api" = same-origin behind the reverse proxy.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
        # Public origin for SEO absolutes; baked at build time (env.ts fails
        # the production build if missing — required, no localhost default).
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?NEXT_PUBLIC_SITE_URL is required}
        # Optional; empty disables client-side Sentry.
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
    image: gymtrack-frontend:latest
    container_name: gymtrack-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      # Absolute backend URL for Node-side fetch (dal.ts, /api/auth/session);
      # browser traffic uses NEXT_PUBLIC_API_URL (inlined at build).
      INTERNAL_API_URL: http://backend:8080/api
      # Also provided at runtime so server-side reads of the (normally
      # build-time-inlined) value never fall back to localhost.
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?NEXT_PUBLIC_SITE_URL is required}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - gymtrack
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  reverse-proxy:
    image: nginx:1.27-alpine
    container_name: gymtrack-reverse-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - gymtrack
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: gymtrack-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
    networks:
      - gymtrack
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  grafana:
    image: grafana/grafana:11.5.0
    container_name: gymtrack-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      # No default password: compose refuses to start until it is set.
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      # Public URL (scheme/host) used for links, redirects and cookies. Point
      # this at the HTTPS reverse-proxy host in production.
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-http://localhost:3001}
      - GF_SERVER_DOMAIN=${GRAFANA_SERVER_DOMAIN:-localhost}
      # Self-service sign-up and anonymous access stay off; access is via
      # 127.0.0.1 or the TLS reverse proxy only.
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_USERS_ALLOW_ORG_CREATE=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_AUTH_DISABLE_LOGIN_FORM=false
      - GF_SECURITY_COOKIE_SECURE=${GRAFANA_COOKIE_SECURE:-false}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - gymtrack
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  pgadmin:
    image: dpage/pgadmin4:8.14
    container_name: gymtrack-pgadmin
    restart: unless-stopped
    profiles: ["tools"]
    ports:
      - "127.0.0.1:5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@admin.com}
      # No hardcoded password (the old "admin" default is gone). The empty
      # default keeps `docker compose up` working when the tools profile is not
      # used: compose interpolates every service, profiles or not, so a
      # ${PGADMIN_PASSWORD:?} here would block the whole stack. pgadmin itself
      # exits at first init when this is empty ("You need to define the
      # PGADMIN_DEFAULT_EMAIL and PGADMIN_DEFAULT_PASSWORD ..."), so the profile
      # still cannot come up with a known password.
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy
    networks:
      - gymtrack
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

volumes:
  pgdata:
  prometheus_data:
  grafana_data:
  pgadmin_data:

networks:
  gymtrack:
    driver: bridge
    # Pinned subnet so the backend can trust exactly this network's addresses
    # via TRUSTED_PROXIES. Docker would otherwise assign an arbitrary 172.16/12
    # range, forcing a /12 trust that covers every other bridge network on the
    # host (and therefore every unrelated container).
    ipam:
      config:
        - subnet: ${GYMTRACK_SUBNET:-172.31.0.0/24}
