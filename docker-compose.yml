services:
  db:
    # Built from ./postgres/Dockerfile so pgAudit and pg_partman are
    # available. (pg_stat_statements is bundled in the base image
    # contrib and only needs preloading + CREATE EXTENSION.)
    build:
      context: ./postgres
      dockerfile: Dockerfile
    image: gymtrack-postgres:16-ext
    container_name: gymtrack-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: fitness_app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs CREATE EXTENSION on first init only (pgdata must be empty)
      - ./postgres/init-extensions.sql:/docker-entrypoint-initdb.d/init-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    # Preload shared libraries and tune each extension. pg_partman_bgw is
    # the background worker that auto-maintains partitions; it needs to know
    # which database(s) to run in via pg_partman_bgw.dbname.
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements,pgaudit,pg_partman_bgw
      -c pg_stat_statements.max=10000
      -c pg_stat_statements.track=all
      -c pgaudit.log=write,ddl,role
      -c pgaudit.log_parameter=on
      -c pgaudit.log_relation=on
      -c pg_partman_bgw.interval=1h
      -c pg_partman_bgw.role=postgres
      -c pg_partman_bgw.dbname=fitness_app

  pgadmin:
    image: dpage/pgadmin4
    container_name: gymtrack-pgadmin
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: gymtrack-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  grafana:
    image: grafana/grafana:11.5.0
    container_name: gymtrack-grafana
    ports:
      - "3001:3000"  # 3001=Grafana (3000=Next.js)
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

volumes:
  pgdata:
  pgadmin_data:
  prometheus_data:
  grafana_data:
